<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WoW Crafting Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Palette and type follow worldofwarcraft.blizzard.com/forever (its "wow-color" and Forever
       theme tokens). Headings there use Friz Quadrata, a licensed font we can't redistribute:
       it's used when installed locally, otherwise Marcellus stands in. */
    :root {
      --bg:          #011c2b;   /* Forever teal-800, page background */
      --bg-2:        #07324a;   /* teal-700 */
      --card:        rgba(4, 15, 26, 0.86);    /* blue-700 */
      --card-solid:  #061826;
      --surface:     rgba(255, 255, 255, 0.04);
      --surface-2:   rgba(255, 255, 255, 0.07);
      --surface-3:   rgba(255, 255, 255, 0.1);
      --border:      rgba(255, 255, 255, 0.08);
      --border-md:   rgba(255, 255, 255, 0.15);
      --accent:      #0093b2;   /* teal-300 */
      --accent-hi:   #00afd7;   /* teal-200 */
      --accent-tint: rgba(0, 147, 178, 0.14);
      --accent-line: rgba(0, 175, 215, 0.45);
      --green:       #116569;   /* Forever green-300, primary action */
      --green-hi:    #146f73;
      --green-lo:    #0f6064;
      --navy-btn:    #114f72;   /* teal-600, secondary action */
      --gold:        #ffd254;   /* wow gold-400, links */
      --camel:       #c6af8d;   /* camel-400 */
      --heading:     #f3eee2;   /* beige-200 */
      --text:        #ffffff;
      --text-soft:   rgba(255, 255, 255, 0.78);
      --text-muted:  rgba(255, 255, 255, 0.5);
      --blue:        #7fd3ec;
      --q0: #9d9d9d; --q1: #f3eee2; --q2: #3ddc4b; --q3: #4a9bff; --q4: #b45cff; --q5: #ff9a2e;
      --d1: #ff8040; --d2: #ffe14a; --d3: #4fd15c; --d4: #8a8a8a;
      --radius-lg:   6px;
      --radius:      4px;
      --radius-sm:   3px;
      --shadow:      0 24px 60px rgba(0, 0, 0, 0.55), 0 2px 8px rgba(0, 0, 0, 0.35);
      --font-heading: 'Friz Quadrata TT', 'Friz Quadrata', 'Marcellus', Georgia, serif;
      --font-body:    'Open Sans', Arial, Helvetica, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.45;
      min-height: 100vh;
      padding: 28px 24px 48px;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 55%);
      background-attachment: fixed;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(1, 28, 43, 0.2) 0%, rgba(1, 28, 43, 0.92) 70%),
        var(--exp-bg, none) center top / cover no-repeat;
      opacity: 0.7;
      pointer-events: none;
      z-index: 0;
    }

    body > * { position: relative; z-index: 1; }

    button { font-family: inherit; color: inherit; }

    /* ── Header ─────────────────────────────────────────────────────────── */
    header {
      max-width: 1240px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 8px 10px 8px 14px;
      background: rgba(10, 38, 44, 0.88);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-right: auto;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: radial-gradient(circle at 35% 30%, var(--accent-hi), var(--navy-btn) 70%);
      border: 2px solid var(--camel);
      display: grid;
      place-items: center;
      color: var(--heading);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .brand-mark svg { width: 17px; height: 17px; }

    .brand h1 {
      font-family: var(--font-heading);
      font-size: 1.25rem;
      font-weight: 400;
      color: var(--heading);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    }

    .brand h1 span { color: var(--camel); }

    .segmented {
      display: flex;
      gap: 4px;
    }

    .exp-btn {
      padding: 7px 14px 6px;
      border: none;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      background: transparent;
      color: var(--text-soft);
      font-family: var(--font-heading);
      font-size: 1rem;
      font-weight: 400;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.15s, background 0.15s;
    }

    .exp-btn:hover:not(.disabled) { color: var(--text); }
    .exp-btn.active { color: var(--heading); border-bottom-color: var(--accent); text-shadow: 0 0 12px rgba(0, 175, 215, 0.35); }
    .exp-btn.disabled { opacity: 0.35; cursor: default; }

    .cart-btn {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 38px;
      padding: 0 16px;
      background: linear-gradient(180deg, #4b9a8a, #3a8475);
      border: none;
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.15s;
    }

    .cart-btn:hover { filter: brightness(1.12); }
    .cart-btn svg { width: 16px; height: 16px; color: var(--text); }

    .cart-count {
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 999px;
      background: var(--gold);
      color: #1a1206;
      font-size: 0.72rem;
      font-weight: 700;
      display: grid;
      place-items: center;
    }

    .cart-count.hidden { display: none; }

    .exp-notice {
      max-width: 1240px;
      margin: -10px auto 14px;
      text-align: right;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    #status { text-align: center; color: var(--text-muted); padding: 80px 0; }

    /* ── Layout ─────────────────────────────────────────────────────────── */
    .layout {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      align-items: flex-start;
      gap: 18px;
    }

    .prof-rail {
      flex: 0 0 210px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      backdrop-filter: blur(14px);
    }

    .rail-label {
      padding: 6px 10px 8px;
      font-family: var(--font-heading);
      font-size: 0.86rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--camel);
    }

    .prof-tab {
      position: relative;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 7px 10px;
      background: none;
      border: none;
      border-radius: var(--radius-sm);
      color: var(--text-soft);
      text-align: left;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .prof-tab:hover { background: var(--surface-2); color: var(--text); }

    .prof-tab img {
      width: 32px;
      height: 32px;
      border-radius: var(--radius);
      flex-shrink: 0;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6), 0 0 0 2px var(--border);
    }

    .prof-tab-name { font-size: 0.88rem; font-weight: 500; flex: 1; }

    .prof-tab-count {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .prof-tab.active { background: var(--accent-tint); color: var(--heading); }
    .prof-tab.active img { box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6), 0 0 0 2px var(--accent-line); }
    .prof-tab.active::before {
      content: '';
      position: absolute;
      left: -8px;
      top: 9px;
      bottom: 9px;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--accent);
    }

    /* ── Main card ──────────────────────────────────────────────────────── */
    .window {
      flex: 1;
      min-width: 0;
      display: flex;
      height: min(760px, calc(100vh - 110px));
      min-height: 540px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      overflow: hidden;
    }

    /* list column */
    .list-pane {
      flex: 0 0 330px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-right: 1px solid var(--border);
    }

    .list-head {
      padding: 16px 16px 10px;
      flex-shrink: 0;
    }

    .list-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .list-title h2 { font-family: var(--font-heading); font-size: 1.45rem; font-weight: 400; color: var(--heading); }
    .list-title span { font-size: 0.78rem; color: var(--text-muted); }

    .search-wrap { position: relative; }

    .search-wrap svg {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 36px;
      padding: 0 12px 0 34px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: inherit;
      font-size: 0.86rem;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }

    .search-input::placeholder { color: var(--text-muted); }
    .search-input:focus { border-color: var(--accent-line); background: var(--surface-2); }

    .recipe-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0 8px 12px;
    }

    .cat-header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      margin-top: 6px;
      padding: 9px 8px 6px;
      background: var(--card-solid);
      border: none;
      color: var(--camel);
      font-family: var(--font-heading);
      font-size: 0.84rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-align: left;
      cursor: pointer;
    }

    .cat-header .cat-name { flex: 1; }
    .cat-header .cat-count { color: var(--text-muted); font-weight: 500; letter-spacing: 0; }

    .cat-header svg {
      width: 12px;
      height: 12px;
      color: var(--text-muted);
      transition: transform 0.15s;
    }

    .cat-header.collapsed svg { transform: rotate(-90deg); }
    .cat-header:hover .cat-name { color: var(--heading); }

    .recipe-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 6px 8px;
      background: none;
      border: none;
      border-radius: var(--radius-sm);
      color: var(--text-soft);
      font-size: 0.85rem;
      text-align: left;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
    }

    .recipe-row:hover { background: var(--surface-2); color: var(--text); }

    .recipe-row.selected {
      background: var(--accent-tint);
      color: var(--text);
      box-shadow: inset 0 0 0 1px var(--accent-line);
    }

    .recipe-row img {
      width: 22px;
      height: 22px;
      border-radius: var(--radius-sm);
      flex-shrink: 0;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.55);
    }

    .recipe-row .rname {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .recipe-row .rmeta {
      flex-shrink: 0;
      font-size: 0.72rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .list-empty {
      padding: 32px 12px;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
      line-height: 1.7;
    }

    .list-empty a { color: var(--gold); cursor: pointer; }
    .list-empty a:hover { color: var(--heading); }

    /* scrollbars */
    .recipe-list, .detail-scroll, .cart-scroll { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.14) transparent; }
    .recipe-list::-webkit-scrollbar, .detail-scroll::-webkit-scrollbar, .cart-scroll::-webkit-scrollbar { width: 8px; }
    .recipe-list::-webkit-scrollbar-thumb, .detail-scroll::-webkit-scrollbar-thumb, .cart-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.14);
      border-radius: 8px;
    }

    /* detail column */
    .detail-pane {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .detail-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 24px 26px;
    }

    .detail-head {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .detail-icon {
      width: 60px;
      height: 60px;
      flex-shrink: 0;
      border-radius: var(--radius);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.7), 0 0 0 3px var(--camel), 0 8px 20px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    .detail-icon img { display: block; width: 100%; height: 100%; }

    .detail-titles { flex: 1; min-width: 0; }

    .detail-name {
      font-family: var(--font-heading);
      font-size: 1.7rem;
      font-weight: 400;
      line-height: 1.15;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    }

    .detail-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-top: 7px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 22px;
      padding: 0 9px;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      color: var(--text-soft);
      font-size: 0.74rem;
      font-weight: 500;
    }

    .chip.skill { gap: 7px; font-variant-numeric: tabular-nums; }
    .chip.skill i { font-style: normal; }
    .chip.skill .d1 { color: var(--d1); }
    .chip.skill .d2 { color: var(--d2); }
    .chip.skill .d3 { color: var(--d3); }
    .chip.skill .d4 { color: var(--d4); }

    .fav-btn {
      align-self: flex-start;
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .fav-btn svg { width: 17px; height: 17px; }
    .fav-btn:hover { color: var(--text); border-color: var(--border-md); }
    .fav-btn.on { color: var(--gold); border-color: var(--accent-line); }
    .fav-btn.on svg { fill: currentColor; }

    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 14px;
    }

    .section-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      font-family: var(--font-heading);
      font-size: 0.86rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--camel);
    }

    .section-title .hint { font-family: var(--font-body); color: var(--text-muted); letter-spacing: 0; text-transform: none; font-size: 0.74rem; }

    .reagent {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 6px 8px;
      margin: 0 -8px;
      border-radius: var(--radius-sm);
      user-select: none;
    }

    .reagent.craftable { cursor: pointer; }
    .reagent.craftable:hover { background: var(--surface-2); }

    .reagent img {
      width: 34px;
      height: 34px;
      border-radius: var(--radius);
      flex-shrink: 0;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6), 0 0 0 2px var(--border);
    }

    .reagent.child img { width: 26px; height: 26px; border-radius: var(--radius-sm); }

    .reagent-name { flex: 1; min-width: 0; font-size: 0.88rem; color: var(--text-soft); }
    .reagent-name .qty { color: var(--text); font-weight: 600; margin-right: 6px; font-variant-numeric: tabular-nums; }

    .craft-badge {
      flex-shrink: 0;
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--blue);
      background: rgba(0, 147, 178, 0.14);
      border-radius: var(--radius-sm);
      padding: 2px 9px;
    }

    .reagent .caret {
      width: 14px;
      height: 14px;
      color: var(--text-muted);
      flex-shrink: 0;
      transition: transform 0.15s;
    }

    .reagent.open .caret { transform: rotate(90deg); }

    .reagent-children {
      margin-left: 16px;
      padding-left: 14px;
      border-left: 1px solid var(--border-md);
    }

    .reagent-children.hidden { display: none; }

    .raw-mats {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 4px 22px;
    }

    .raw-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 4px 0;
      font-size: 0.85rem;
      color: var(--text-soft);
      min-width: 0;
    }

    .raw-row img {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      border-radius: var(--radius-sm);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6);
    }

    .raw-row .rn { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .raw-row .rq { color: var(--text); font-weight: 600; flex-shrink: 0; font-variant-numeric: tabular-nums; }

    .detail-empty { padding: 60px 10px; text-align: center; color: var(--text-muted); }

    /* action bar */
    .detail-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      padding: 14px 26px;
      border-top: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.18);
    }

    .bar-note { margin-right: auto; font-size: 0.8rem; color: var(--text-muted); }

    .stepper {
      display: flex;
      align-items: center;
      height: 38px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-md);
      border-radius: var(--radius);
    }

    .step-btn {
      width: 36px;
      height: 100%;
      background: none;
      border: none;
      color: var(--text-soft);
      font-size: 1.05rem;
      cursor: pointer;
    }

    .step-btn:hover { color: var(--accent-hi); }

    .qty-input {
      width: 46px;
      height: 100%;
      text-align: center;
      background: none;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      outline: none;
      -moz-appearance: textfield;
    }

    .qty-input::-webkit-outer-spin-button,
    .qty-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

    .btn-primary {
      height: 38px;
      padding: 0 22px;
      border: 1px solid var(--green-hi);
      border-radius: var(--radius);
      background:
        radial-gradient(50% 50% at 50% 50%, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0) 100%),
        linear-gradient(180deg, var(--green-hi), var(--green-lo));
      color: var(--text);
      font-family: var(--font-heading);
      font-size: 1rem;
      font-weight: 400;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      transition: filter 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .btn-primary:hover:not(:disabled) { filter: brightness(1.15); }
    .btn-primary:active:not(:disabled) { transform: translateY(1px); }
    .btn-primary:disabled { opacity: 0.4; cursor: default; box-shadow: none; }

    .btn-ghost {
      height: 34px;
      padding: 0 16px;
      background: linear-gradient(180deg, #145a80, var(--navy-btn));
      border: 1px solid rgba(0, 175, 215, 0.3);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-ghost:hover { filter: brightness(1.15); }

    /* ── Cart drawer ────────────────────────────────────────────────────── */
    .cart-overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .cart-overlay.open { opacity: 1; pointer-events: auto; }

    .cart-drawer {
      position: fixed;
      z-index: 41;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(420px, 100vw);
      display: flex;
      flex-direction: column;
      background: var(--card-solid);
      border-left: 1px solid var(--border);
      box-shadow: -20px 0 60px rgba(0, 0, 0, 0.5);
      transform: translateX(100%);
      transition: transform 0.25s ease;
    }

    .cart-drawer.open { transform: translateX(0); }

    .cart-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 22px 14px;
      border-bottom: 1px solid var(--border);
    }

    .cart-head h2 { font-family: var(--font-heading); font-size: 1.35rem; font-weight: 400; color: var(--heading); }

    .close-btn {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-soft);
      cursor: pointer;
    }

    .close-btn:hover { color: var(--text); }
    .close-btn svg { width: 14px; height: 14px; }

    .cart-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 22px 20px; }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
    }

    .cart-item:last-child { border-bottom: none; }

    .cart-item img {
      width: 34px;
      height: 34px;
      border-radius: var(--radius);
      flex-shrink: 0;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6), 0 0 0 2px var(--border);
    }

    .cart-item-info { flex: 1; min-width: 0; }
    .cart-item-name { font-size: 0.88rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cart-item-prof { font-size: 0.76rem; color: var(--text-muted); }
    .cart-item-qty { font-size: 0.84rem; font-weight: 600; color: var(--gold); font-variant-numeric: tabular-nums; }

    .cart-remove {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      background: none;
      border: none;
      border-radius: 50%;
      color: var(--text-muted);
      cursor: pointer;
    }

    .cart-remove:hover { color: #ff6b6b; background: rgba(255, 107, 107, 0.1); }
    .cart-remove svg { width: 12px; height: 12px; }

    .cart-empty { padding: 50px 0; text-align: center; color: var(--text-muted); }

    .cart-mats { margin-top: 18px; }
    .cart-mats .raw-mats { grid-template-columns: 1fr; }

    .cart-foot {
      display: flex;
      justify-content: flex-end;
      padding: 14px 22px;
      border-top: 1px solid var(--border);
    }

    /* ── Phone layout ───────────────────────────────────────────────────── */
    @media (max-width: 900px) {
      body { padding: 16px 16px 32px; }

      header { flex-wrap: wrap; gap: 8px 12px; }
      .brand h1 span { display: none; }
      .brand h1 { font-size: 1.08rem; }
      .cart-btn { height: 34px; padding: 0 12px; }
      .segmented { order: 3; width: 100%; }
      .exp-btn { flex: 1; padding: 6px 4px 5px; font-size: 0.95rem; }
      .exp-notice { text-align: center; }

      .layout { flex-direction: column; gap: 12px; }

      .prof-rail {
        flex: none;
        width: 100%;
        flex-direction: row;
        overflow-x: auto;
        padding: 6px;
        scrollbar-width: none;
      }

      .prof-rail::-webkit-scrollbar { display: none; }
      .rail-label { display: none; }

      .prof-tab { flex-shrink: 0; gap: 8px; padding: 6px 10px; }
      .prof-tab img { width: 26px; height: 26px; border-radius: 7px; }
      .prof-tab-count { display: none; }
      .prof-tab.active::before { display: none; }

      .window { flex-direction: column; height: auto; min-height: 0; }
      .list-pane { flex: none; height: 48vh; border-right: none; border-bottom: 1px solid var(--border); }
      .detail-scroll { padding: 18px 16px; }
      .detail-bar { padding: 12px 16px; }
      .bar-note { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>
    </div>
    <h1>Crafting Calculator <span>for WoW</span></h1>
  </div>
  <div class="segmented" id="expansion-bar" style="display:none">
    <button class="exp-btn" data-exp="classic">Classic</button>
    <button class="exp-btn active" data-exp="tbc">TBC</button>
    <button class="exp-btn" data-exp="wotlk">WotLK</button>
    <button class="exp-btn" data-exp="forever">Forever</button>
  </div>
  <button class="cart-btn" id="cart-btn" title="Shopping cart">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    Cart
    <span class="cart-count hidden" id="cart-count">0</span>
  </button>
</header>

<div id="status">Loading data...</div>

<div class="layout" id="layout" style="display:none">
  <nav class="prof-rail" id="prof-rail" aria-label="Professions"></nav>

  <section class="window" aria-label="Recipes">
    <div class="list-pane">
      <div class="list-head">
        <div class="list-title"><h2 id="window-title">Professions</h2><span id="list-count"></span></div>
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="search" class="search-input" type="text" placeholder="Search recipes" autocomplete="off" spellcheck="false">
        </div>
      </div>
      <div class="recipe-list" id="recipe-list"></div>
    </div>

    <div class="detail-pane">
      <div class="detail-scroll" id="detail"></div>
      <div class="detail-bar">
        <span class="bar-note" id="bar-note"></span>
        <div class="stepper">
          <button class="step-btn" id="qty-minus" aria-label="Fewer">−</button>
          <input type="number" id="qty" class="qty-input" value="1" min="1" max="9999" aria-label="Crafts">
          <button class="step-btn" id="qty-plus" aria-label="More">+</button>
        </div>
        <button class="btn-primary" id="add-to-cart-btn">Add to cart</button>
      </div>
    </div>
  </section>
</div>

<div class="cart-overlay" id="cart-overlay"></div>
<aside class="cart-drawer" id="cart-drawer" aria-label="Shopping cart">
  <div class="cart-head">
    <h2>Shopping cart</h2>
    <button class="close-btn" id="cart-close" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="cart-scroll">
    <div id="cart-items"></div>
    <div class="section cart-mats" id="cart-mats">
      <div class="section-title">Total raw materials</div>
      <div class="raw-mats" id="cart-raw-mats"></div>
    </div>
  </div>
  <div class="cart-foot">
    <button class="btn-ghost" id="cart-clear-btn">Clear cart</button>
  </div>
</aside>

<script>
const PROFESSIONS = {
  129: 'First Aid',
  164: 'Blacksmithing',
  165: 'Leatherworking',
  171: 'Alchemy',
  182: 'Herbalism',
  185: 'Cooking',
  186: 'Mining',
  197: 'Tailoring',
  202: 'Engineering',
  333: 'Enchanting',
  356: 'Fishing',
  393: 'Skinning',
  755: 'Jewelcrafting',
};

const PROF_ICONS = {
  171: 'trade_alchemy',
  164: 'trade_blacksmithing',
  185: 'inv_misc_food_15',
  333: 'trade_engraving',
  202: 'trade_engineering',
  129: 'spell_holy_sealofsacrifice',
  755: 'inv_misc_gem_01',
  165: 'inv_misc_armorkit_17',
  186: 'trade_mining',
  197: 'trade_tailoring',
};

const CRAFT_TYPES = new Set([164,165,171,185,186,197,202,333,755,129]);

// Forever is its own game with its own recipe set, so it gets a separate dataset
// instead of being filtered out of the Classic/TBC/WotLK pool by skill level.
const EXPANSIONS = {
  classic: { label: 'Classic',               maxSkill: 300, data: 'classic' },
  tbc:     { label: 'The Burning Crusade',    maxSkill: 375, data: 'classic' },
  wotlk:   { label: 'Wrath of the Lich King', maxSkill: 450, data: 'classic' },
  forever: { label: 'WoW: Forever',           maxSkill: 300, data: 'forever' },
};

const datasets = {};
let itemsById = {};
let recipesByOutputId = {};
let allRecipes = [];
let currentRecipe = null;
let currentExpansion = 'tbc';
let currentDataset = null;
let currentProf = null;

const prefs = loadPrefs();   // { favorites: {dataset: [keys]}, collapsed: {"dataset:type": [names]} }

function getMaxSkill() { return EXPANSIONS[currentExpansion].maxSkill; }

// The skill-level cut only separates Classic/TBC/WotLK in the shared dataset
function isRecipeInExpansion(recipe) {
  if (currentDataset === 'forever') return true;
  return (recipe.learned_at_rank ?? 0) <= getMaxSkill();
}

function isCraftableInExpansion(itemId) {
  const recipe = recipesByOutputId[itemId];
  if (!recipe || !CRAFT_TYPES.has(recipe.type) || !isRecipeInExpansion(recipe)) return false;
  if (recipe.name.startsWith('Transmute')) return false;
  const item = itemsById[itemId];
  if (item?.name?.startsWith('Mote of')) return false;
  if (item?.raw) return false;
  if (item?.sources?.some(s => s.type === 1 || s.type === 8 || s.type === 11)) return false;
  return true;
}

function buildDataset(profs, mats) {
  const ds = { itemsById: {}, recipesByOutputId: {}, allRecipes: profs };
  mats.forEach(item => { ds.itemsById[item.id] = item; });
  profs.forEach(recipe => {
    if (recipe.creates?.item_id && !ds.recipesByOutputId[recipe.creates.item_id]) {
      ds.recipesByOutputId[recipe.creates.item_id] = recipe;
    }
  });
  return ds;
}

function useDataset(name) {
  if (currentDataset === name) return;
  ({ itemsById, recipesByOutputId, allRecipes } = datasets[name]);
  currentDataset = name;
}

async function tryFetch(url) {
  try {
    const r = await fetch(url);
    return r.ok ? r.json() : [];
  } catch { return []; }
}

async function init() {
  try {
    const [classicProfs, classicMats,
           tbcProfs,     tbcMats,
           wotlkProfs,   wotlkMats,
           foreverProfs, foreverMats] = await Promise.all([
      tryFetch('classic-professions.json'),
      tryFetch('classic-mats.json'),
      tryFetch('tbc-professions.json'),
      tryFetch('tbc-mats.json'),
      tryFetch('wotlk-professions.json'),
      tryFetch('wotlk-mats.json'),
      tryFetch('forever-professions.json'),
      tryFetch('forever-mats.json'),
    ]);

    datasets.classic = buildDataset(
      [...classicProfs, ...tbcProfs, ...wotlkProfs],
      [...classicMats, ...tbcMats, ...wotlkMats]);
    datasets.forever = buildDataset(foreverProfs, foreverMats);

    readHash();
    useDataset(EXPANSIONS[currentExpansion].data);

    document.getElementById('status').style.display = 'none';
    document.getElementById('expansion-bar').style.display = 'flex';
    document.getElementById('layout').style.display = 'flex';
    setupExpansion();
    setupWindow();
    setupCart();
    showView();
  } catch (e) {
    document.getElementById('status').textContent =
      'Failed to load data. Open this file through a local server (see start.bat).';
    console.error(e);
  }
}

// ── Prefs (per-viewer conveniences only) ─────────────────────────────────────
function loadPrefs() {
  let p = {};
  try { p = JSON.parse(localStorage.getItem('craftcalc-prefs')) || {}; } catch {}
  return { favorites: {}, collapsed: {}, ...p };
}

function savePrefs() {
  try { localStorage.setItem('craftcalc-prefs', JSON.stringify(prefs)); } catch {}
}

function recipeKey(r) { return `${r.type}:${r.id}`; }

function isFavorite(r) { return (prefs.favorites[currentDataset] || []).includes(recipeKey(r)); }

function toggleFavorite(r) {
  const list = prefs.favorites[currentDataset] ||= [];
  const k = recipeKey(r), i = list.indexOf(k);
  i >= 0 ? list.splice(i, 1) : list.push(k);
  savePrefs();
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function getItemName(id) {
  return itemsById[id]?.name || `Item #${id}`;
}

function getProfName(type) {
  return PROFESSIONS[type] || `Profession ${type}`;
}

function profSlug(type) { return getProfName(type).toLowerCase().replace(/\s+/g, '-'); }

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Icons are hotlinked from Wowhead's CDN by slug; unknown or broken ones fall back to "?"
const ICON_CDN      = 'https://wow.zamimg.com/images/wow/icons/';
const ICON_FALLBACK = 'inv_misc_questionmark';

function iconUrl(slug, size = 'medium') {
  return `${ICON_CDN}${size}/${slug || ICON_FALLBACK}.jpg`;
}

function iconHtml(slug, size = 'medium') {
  const fb = iconUrl(ICON_FALLBACK, size);
  return `<img src="${iconUrl(slug, size)}" alt="" loading="lazy" onerror="this.onerror=null;this.src='${fb}'">`;
}

function getItemIcon(id) {
  return itemsById[id]?.icon || '';
}

function qualityColor(r) {
  const q = r.creates?.item_id ? itemsById[r.creates.item_id]?.quality : null;
  return q != null && q >= 0 && q <= 5 ? `var(--q${q})` : 'var(--text)';
}

const STAR    = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2.8l2.8 5.8 6.4.9-4.6 4.5 1.1 6.3L12 17.3l-5.7 3 1.1-6.3-4.6-4.5 6.4-.9z"/></svg>';
const CARET   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const CARET_R = '<svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
const CROSS   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

// ── View: expansion + profession ─────────────────────────────────────────────
function professionsForView() {
  const counts = {};
  for (const r of allRecipes) {
    if (CRAFT_TYPES.has(r.type) && r.reagents?.length && isRecipeInExpansion(r)) {
      counts[r.type] = (counts[r.type] || 0) + 1;
    }
  }
  return Object.keys(counts).map(Number)
    .sort((a, b) => getProfName(a).localeCompare(getProfName(b)))
    .map(type => ({ type, count: counts[type] }));
}

function showView() {
  const profs = professionsForView();
  if (!profs.some(p => p.type === currentProf)) currentProf = profs[0]?.type ?? null;
  if (currentRecipe && (currentRecipe.type !== currentProf || !allRecipes.includes(currentRecipe))) currentRecipe = null;

  const rail = document.getElementById('prof-rail');
  rail.innerHTML = '<div class="rail-label">Professions</div>' + profs.map(p => `
    <button class="prof-tab${p.type === currentProf ? ' active' : ''}" data-type="${p.type}">
      ${iconHtml(PROF_ICONS[p.type], 'large')}
      <span class="prof-tab-name">${esc(getProfName(p.type))}</span>
      <span class="prof-tab-count">${p.count}</span>
    </button>
  `).join('');
  rail.querySelectorAll('.prof-tab').forEach(btn => {
    btn.addEventListener('click', () => selectProfession(Number(btn.dataset.type)));
  });

  document.getElementById('window-title').textContent = currentProf ? getProfName(currentProf) : 'Professions';
  renderList();
  if (!currentRecipe) currentRecipe = firstVisibleRecipe();
  renderList();
  renderDetail();
  writeHash();
}

function selectProfession(type) {
  if (type === currentProf) return;
  currentProf = type;
  currentRecipe = null;
  document.getElementById('search').value = '';
  showView();
  document.querySelector('.prof-tab.active')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

// ── Recipe list ──────────────────────────────────────────────────────────────
function visibleRecipes() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  return allRecipes.filter(r =>
    r.type === currentProf && r.reagents?.length && isRecipeInExpansion(r) &&
    (!q || r.name.toLowerCase().includes(q)));
}

function recipeSkill(r) { return r.learned_at_rank ?? r.color_level_1 ?? r.color_level_2 ?? 0; }

function groupRecipes(list) {
  const groups = new Map();
  const favs = list.filter(isFavorite);
  if (favs.length) groups.set('Favorites', { order: -1, recipes: favs });
  for (const r of list) {
    const name = r.category || 'Miscellaneous';
    if (!groups.has(name)) groups.set(name, { order: Infinity, recipes: [] });
    const g = groups.get(name);
    g.recipes.push(r);
    if (r.category_order != null) g.order = Math.min(g.order, r.category_order);
  }
  for (const g of groups.values()) {
    g.recipes.sort((a, b) => recipeSkill(b) - recipeSkill(a) || a.name.localeCompare(b.name));
  }
  return [...groups.entries()].sort(([an, a], [bn, b]) =>
    (a.order - b.order) ||
    ((an === 'Miscellaneous') - (bn === 'Miscellaneous')) ||
    an.localeCompare(bn));
}

function firstVisibleRecipe() {
  const groups = groupRecipes(visibleRecipes());
  return groups[0]?.[1].recipes[0] || null;
}

function renderList() {
  const listEl = document.getElementById('recipe-list');
  const list = visibleRecipes();
  const collapsed = new Set(prefs.collapsed[`${currentDataset}:${currentProf}`] || []);
  document.getElementById('list-count').textContent = `${list.length} recipe${list.length === 1 ? '' : 's'}`;

  if (!list.length) {
    const q = document.getElementById('search').value.trim().toLowerCase();
    let html = '<div class="list-empty">No recipes found';
    if (q) {
      const elsewhere = professionsForView().map(p => ({
        ...p, n: allRecipes.filter(r => r.type === p.type && r.reagents?.length && isRecipeInExpansion(r) && r.name.toLowerCase().includes(q)).length,
      })).filter(p => p.n && p.type !== currentProf);
      if (elsewhere.length) {
        html += '<br>Try ' + elsewhere.map(p =>
          `<a data-type="${p.type}">${esc(getProfName(p.type))} (${p.n})</a>`).join(', ');
      }
    }
    listEl.innerHTML = html + '</div>';
    listEl.querySelectorAll('a[data-type]').forEach(a => a.addEventListener('click', () => {
      const q = document.getElementById('search').value;
      currentProf = Number(a.dataset.type);
      currentRecipe = null;
      showView();
      document.getElementById('search').value = q;
      currentRecipe = firstVisibleRecipe();
      renderList();
      renderDetail();
    }));
    return;
  }

  listEl.innerHTML = groupRecipes(list).map(([name, g]) => {
    const isCollapsed = collapsed.has(name);
    const rows = isCollapsed ? '' : g.recipes.map(r => {
      const makes = r.creates?.item_count > 1 ? `<span class="rmeta">×${r.creates.item_count}</span>` : '';
      return `<button class="recipe-row${r === currentRecipe ? ' selected' : ''}" data-idx="${allRecipes.indexOf(r)}">
        ${iconHtml(r.icon)}<span class="rname">${esc(r.name)}</span>${makes}
      </button>`;
    }).join('');
    return `<button class="cat-header${isCollapsed ? ' collapsed' : ''}" data-cat="${esc(name)}">
      ${CARET}<span class="cat-name">${esc(name)}</span><span class="cat-count">${g.recipes.length}</span>
    </button>${rows}`;
  }).join('');

  listEl.querySelectorAll('.cat-header').forEach(h => h.addEventListener('click', () => {
    const key = `${currentDataset}:${currentProf}`;
    const set = new Set(prefs.collapsed[key] || []);
    set.has(h.dataset.cat) ? set.delete(h.dataset.cat) : set.add(h.dataset.cat);
    prefs.collapsed[key] = [...set];
    savePrefs();
    renderList();
  }));

  listEl.querySelectorAll('.recipe-row').forEach(row => row.addEventListener('click', () => {
    selectRecipe(allRecipes[Number(row.dataset.idx)]);
  }));
}

function selectRecipe(recipe) {
  currentRecipe = recipe;
  document.getElementById('qty').value = 1;
  document.querySelectorAll('.recipe-row.selected').forEach(el => el.classList.remove('selected'));
  document.querySelector(`.recipe-row[data-idx="${allRecipes.indexOf(recipe)}"]`)?.classList.add('selected');
  renderDetail();
  writeHash();
}

// ── Detail panel ─────────────────────────────────────────────────────────────
function getQty() {
  return Math.max(1, Math.min(9999, parseInt(document.getElementById('qty').value) || 1));
}

function renderDetail() {
  const el = document.getElementById('detail');
  const addBtn = document.getElementById('add-to-cart-btn');
  const note = document.getElementById('bar-note');
  if (!currentRecipe) {
    el.innerHTML = '<div class="detail-empty">Select a recipe from the list</div>';
    addBtn.disabled = true;
    note.textContent = '';
    return;
  }
  addBtn.disabled = false;

  const r = currentRecipe;
  const qty = getQty();
  const makes = r.creates?.item_count || 1;
  note.textContent = makes * qty > 1 ? `Makes ${makes * qty}` : '';

  const levels = [r.learned_at_rank ?? r.color_level_1, r.color_level_2, r.color_level_3, r.color_level_4];
  const skillChip = levels.some(v => v != null)
    ? `<span class="chip skill" title="Skill: learn · yellow · green · grey">${levels.map((v, i) => v != null ? `<i class="d${i + 1}">${v}</i>` : '').join('')}</span>`
    : '';

  el.innerHTML = `
    <div class="detail-head">
      <div class="detail-icon">${iconHtml(r.icon, 'large')}</div>
      <div class="detail-titles">
        <div class="detail-name" style="color:${qualityColor(r)}">${esc(r.name)}</div>
        <div class="detail-meta">
          <span class="chip">${esc(getProfName(r.type))}</span>
          ${r.category ? `<span class="chip">${esc(r.category)}</span>` : ''}
          ${makes > 1 ? `<span class="chip">Makes ${makes}</span>` : ''}
          ${skillChip}
        </div>
      </div>
      <button class="fav-btn${isFavorite(r) ? ' on' : ''}" id="fav-btn" title="${isFavorite(r) ? 'Remove from favorites' : 'Add to favorites'}">${STAR}</button>
    </div>
    <div class="section">
      <div class="section-title">Reagents<span class="hint">${qty > 1 ? `for ${qty} crafts · ` : ''}click a sub-craft to expand</span></div>
      <div id="reagents"></div>
    </div>
    <div class="section">
      <div class="section-title">Raw materials</div>
      <div class="raw-mats" id="raw-mats"></div>
    </div>
  `;

  document.getElementById('fav-btn').addEventListener('click', () => {
    toggleFavorite(r);
    renderList();
    renderDetail();
  });

  const reagentsEl = document.getElementById('reagents');
  const visited = new Set([r.creates?.item_id]);
  (r.reagents ?? []).forEach(rg => {
    reagentsEl.appendChild(buildReagent(rg.item_id, rg.item_count * qty, visited, false));
  });

  renderRawMats(document.getElementById('raw-mats'), rawTotals([{ recipe: r, qty }]));
}

function buildReagent(itemId, qty, visited, isChild) {
  const recipe = recipesByOutputId[itemId];
  const craftable = isCraftableInExpansion(itemId) && !visited.has(itemId);
  const wrap = document.createElement('div');

  const row = document.createElement('div');
  row.className = 'reagent' + (craftable ? ' craftable' : '') + (isChild ? ' child' : '');
  row.innerHTML = `
    ${iconHtml(getItemIcon(itemId))}
    <span class="reagent-name"><span class="qty">${qty}</span>${esc(getItemName(itemId))}</span>
    ${craftable ? `<span class="craft-badge">${esc(getProfName(recipe.type))}</span>${CARET_R}` : ''}
  `;
  wrap.appendChild(row);

  if (craftable) {
    const children = document.createElement('div');
    children.className = 'reagent-children hidden';
    let built = false;
    row.addEventListener('click', () => {
      const open = children.classList.toggle('hidden') === false;
      row.classList.toggle('open', open);
      if (open && !built) {
        built = true;
        const batches = Math.ceil(qty / (recipe.creates?.item_count || 1));
        const next = new Set(visited);
        next.add(itemId);
        (recipe.reagents ?? []).forEach(rg => {
          children.appendChild(buildReagent(rg.item_id, rg.item_count * batches, next, true));
        });
      }
    });
    wrap.appendChild(children);
  }
  return wrap;
}

function flattenMats(itemId, qty, visited, totals) {
  if (visited.has(itemId)) { totals[itemId] = (totals[itemId] || 0) + qty; return; }
  if (!isCraftableInExpansion(itemId)) { totals[itemId] = (totals[itemId] || 0) + qty; return; }

  const recipe = recipesByOutputId[itemId];
  const creates = recipe.creates?.item_count || 1;
  const batches = Math.ceil(qty / creates);
  const newVisited = new Set(visited);
  newVisited.add(itemId);

  (recipe.reagents ?? []).forEach(r => {
    flattenMats(r.item_id, r.item_count * batches, newVisited, totals);
  });
}

function rawTotals(entries) {
  const totals = {};
  for (const { recipe, qty } of entries) {
    const visited = new Set([recipe.creates?.item_id]);
    (recipe.reagents ?? []).forEach(r => {
      flattenMats(r.item_id, r.item_count * qty, new Set(visited), totals);
    });
  }
  return totals;
}

function renderRawMats(el, totals) {
  const sorted = Object.entries(totals).sort(([, a], [, b]) => b - a);
  el.innerHTML = sorted.map(([id, count]) => `
    <div class="raw-row">${iconHtml(getItemIcon(+id))}<span class="rn">${esc(getItemName(+id))}</span><span class="rq">×${count}</span></div>
  `).join('') || '<div class="raw-row">No materials found</div>';
}

// ── Window controls ──────────────────────────────────────────────────────────
function setupWindow() {
  const search = document.getElementById('search');
  search.addEventListener('input', () => {
    renderList();
    if (!visibleRecipes().includes(currentRecipe)) {
      const first = firstVisibleRecipe();
      if (first) { currentRecipe = first; renderList(); renderDetail(); }
    }
  });
  search.addEventListener('keydown', e => {
    if (e.key === 'Escape') { search.value = ''; renderList(); }
  });

  const qty = document.getElementById('qty');
  qty.addEventListener('input', renderDetail);
  document.getElementById('qty-minus').addEventListener('click', () => { qty.value = Math.max(1, getQty() - 1); renderDetail(); });
  document.getElementById('qty-plus').addEventListener('click', () => { qty.value = Math.min(9999, getQty() + 1); renderDetail(); });
}

// ── Expansion selector ───────────────────────────────────────────────────────
function setExpansionBg(exp) {
  const bg = EXPANSIONS[exp].bg || exp;
  document.body.style.setProperty('--exp-bg', `url('bg/${bg}-light.jpg')`);
}

function setupExpansion() {
  const buttons = document.querySelectorAll('.exp-btn');
  const hasWotlk = datasets.classic.allRecipes.some(r => r.learned_at_rank > 375);
  if (!hasWotlk) {
    document.querySelector('[data-exp="wotlk"]').classList.add('disabled');
  }
  const hasForever = datasets.forever.allRecipes.length > 0;
  if (!hasForever) {
    document.querySelector('[data-exp="forever"]').classList.add('disabled');
  }

  buttons.forEach(b => b.classList.toggle('active', b.dataset.exp === currentExpansion));
  setExpansionBg(currentExpansion);

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      const exp = btn.dataset.exp;
      if (exp === currentExpansion) return;
      if (exp === 'wotlk' && !hasWotlk) {
        showExpNotice('WotLK data not loaded — add wotlk-professions.json to enable.');
        return;
      }
      if (exp === 'forever' && !hasForever) {
        showExpNotice('Forever data not loaded — run fetch-forever.js to enable.');
        return;
      }
      currentExpansion = exp;
      useDataset(EXPANSIONS[exp].data);
      loadCart();
      updateCartBtn();
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      clearExpNotice();
      setExpansionBg(exp);
      currentRecipe = null;
      document.getElementById('search').value = '';
      showView();
    });
  });
}

function showExpNotice(msg) {
  let el = document.getElementById('exp-notice');
  if (!el) {
    el = document.createElement('div');
    el.id = 'exp-notice';
    el.className = 'exp-notice';
    document.querySelector('header').after(el);
  }
  el.textContent = msg;
}

function clearExpNotice() {
  const el = document.getElementById('exp-notice');
  if (el) el.remove();
}

// ── URL hash: #expansion/profession/recipeId ─────────────────────────────────
function readHash() {
  const [exp, prof, id] = decodeURIComponent(location.hash.slice(1)).split('/');
  if (!EXPANSIONS[exp]) return;
  currentExpansion = exp;
  useDataset(EXPANSIONS[exp].data);
  const type = Object.keys(PROFESSIONS).map(Number).find(t => profSlug(t) === prof);
  if (type) currentProf = type;
  if (id) currentRecipe = allRecipes.find(r => r.type === type && String(r.id) === id) || null;
}

function writeHash() {
  if (!currentProf) return;
  const parts = [currentExpansion, profSlug(currentProf)];
  if (currentRecipe) parts.push(currentRecipe.id);
  history.replaceState(null, '', '#' + parts.join('/'));
}

// ── Cart ─────────────────────────────────────────────────────────────────────
let cart = [];

// Recipe IDs overlap between Classic and Forever, so each dataset keeps its own cart
function cartKey() {
  return currentDataset === 'forever' ? 'craftcalc-cart-forever' : 'craftcalc-cart';
}

function saveCart() {
  try { localStorage.setItem(cartKey(), JSON.stringify(cart)); } catch {}
}

function loadCart() {
  try { cart = JSON.parse(localStorage.getItem(cartKey())) || []; } catch { cart = []; }
}

function cartRecipe(item) {
  return allRecipes.find(r => r.id === item.recipeId && (!item.profName || getProfName(r.type) === item.profName));
}

function updateCartBtn() {
  const el = document.getElementById('cart-count');
  el.textContent = cart.length;
  el.classList.toggle('hidden', cart.length === 0);
}

function openCart() {
  renderCart();
  document.getElementById('cart-overlay').classList.add('open');
  document.getElementById('cart-drawer').classList.add('open');
}

function closeCart() {
  document.getElementById('cart-overlay').classList.remove('open');
  document.getElementById('cart-drawer').classList.remove('open');
}

function addToCart() {
  if (!currentRecipe) return;
  const qty = getQty();
  const existing = cart.find(i => cartRecipe(i) === currentRecipe);
  if (existing) {
    existing.qty += qty;
  } else {
    cart.push({
      recipeId:  currentRecipe.id,
      name:      currentRecipe.name,
      profName:  getProfName(currentRecipe.type),
      qty,
      creates:   currentRecipe.creates?.item_count || 1,
    });
  }
  saveCart();
  updateCartBtn();

  const btn = document.getElementById('add-to-cart-btn');
  btn.textContent = 'Added ✓';
  setTimeout(() => { btn.textContent = 'Add to cart'; }, 1100);
}

function renderCart() {
  const itemsEl = document.getElementById('cart-items');
  const matsEl  = document.getElementById('cart-raw-mats');
  const matsBox = document.getElementById('cart-mats');

  if (cart.length === 0) {
    itemsEl.innerHTML = '<div class="cart-empty">Your cart is empty</div>';
    matsEl.innerHTML  = '';
    matsBox.style.display = 'none';
    return;
  }
  matsBox.style.display = '';

  itemsEl.innerHTML = cart.map((item, i) => `
    <div class="cart-item">
      ${iconHtml(cartRecipe(item)?.icon)}
      <div class="cart-item-info">
        <div class="cart-item-name" title="${esc(item.name)}">${esc(item.name)}</div>
        <div class="cart-item-prof">${esc(item.profName)}</div>
      </div>
      <span class="cart-item-qty">×${item.qty}</span>
      <button class="cart-remove" data-idx="${i}" title="Remove">${CROSS}</button>
    </div>
  `).join('');

  itemsEl.querySelectorAll('.cart-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      cart.splice(Number(btn.dataset.idx), 1);
      saveCart();
      updateCartBtn();
      renderCart();
    });
  });

  const entries = cart.map(item => ({ recipe: cartRecipe(item), qty: item.qty })).filter(e => e.recipe);
  renderRawMats(matsEl, rawTotals(entries));
}

function setupCart() {
  loadCart();
  updateCartBtn();
  document.getElementById('cart-btn').addEventListener('click', openCart);
  document.getElementById('cart-close').addEventListener('click', closeCart);
  document.getElementById('cart-overlay').addEventListener('click', closeCart);
  document.getElementById('cart-clear-btn').addEventListener('click', () => {
    cart = [];
    saveCart();
    updateCartBtn();
    renderCart();
  });
  document.getElementById('add-to-cart-btn').addEventListener('click', addToCart);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCart(); });
}

init();
</script>
