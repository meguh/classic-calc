<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <title>Venom to Shockwave — PD2 S14 Druid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Build-guide layout: sticky contents sidebar, phase switcher, paperdoll gear panel, collapsible sections.
       Item names use the Diablo II rarity colours. */
    :root {
      --bg: #0f1013; --bg-2: #141519; --panel: #1a1b20; --panel-2: #212228; --line: #2b2d34; --line-2: #3a3c45;
      --text: #e3e3e3; --soft: #b5b5b8; --muted: #7d7e85; --blue: #057af0; --blue-soft: rgba(5, 122, 240, .14); --hl: #ffff90;
      --venom: #8cc95a; --brass: #cfae6e; --accent: var(--venom);
      --unique: #c7b377; --set: #3ddc4b; --runeword: #c7b377; --rare: #f2e05a; --magic: #7b8cff; --crafted: #ff9a2e; --base: #d6d1c4; --any: #9a9aa0;
    }
    body[data-fam="shock"] { --accent: var(--brass); }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font: 14px/1.6 'Poppins', Arial, sans-serif; }
    a { color: var(--blue); text-decoration: none; }
    button { font: inherit; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

    /* site bar + build nav */
    .bar { background: #0a0b0d; border-bottom: 1px solid var(--line); }
    .bar-in { max-width: 1240px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; gap: 28px; min-height: 52px; flex-wrap: wrap; }
    .logo { font-family: 'Marcellus', Georgia, serif; font-size: 1.15rem; color: #fff; white-space: nowrap; }
    .logo span { color: var(--venom); }
    .builds { display: flex; gap: 4px; flex-wrap: wrap; }
    .builds a { color: var(--soft); font-weight: 500; padding: 14px 12px; border-bottom: 2px solid transparent; font-size: .92rem; }
    .builds a:hover { color: #fff; }
    .builds a.on { color: #fff; border-bottom-color: var(--blue); }
    .banner { position: relative; height: 120px; background:
      radial-gradient(ellipse at 50% 120%, color-mix(in srgb, var(--accent) 45%, transparent), transparent 60%),
      linear-gradient(180deg, #1b1310 0%, #0f1013 100%); border-bottom: 1px solid var(--line); overflow: hidden; }
    .banner-in { max-width: 1240px; margin: 0 auto; padding: 0 16px; height: 100%; display: flex; align-items: center; gap: 14px; }
    .crest { width: 54px; height: 54px; border-radius: 10px; display: grid; place-items: center; font-family: 'Marcellus', serif; font-size: 1.6rem; color: #111;
      background: linear-gradient(145deg, var(--accent), color-mix(in srgb, var(--accent) 50%, #000)); box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 40%, transparent); }
    .banner-title { font-family: 'Marcellus', Georgia, serif; font-size: 1.5rem; color: #fff; letter-spacing: .04em; text-transform: uppercase; }
    .crest img { width: 100%; height: 100%; border-radius: inherit; display: block; }
    .crest:has(img) { background: #000; border: 1px solid #4a3f2c; }
    .banner-art { position: absolute; right: max(16px, calc(50% - 600px)); top: -40px; height: 260px; opacity: .55; mix-blend-mode: lighten; pointer-events: none;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 40%); mask-image: linear-gradient(90deg, transparent, #000 40%); }

    .wrap { max-width: 1240px; margin: 0 auto; padding: 14px 16px 60px; }
    .crumbs { font-size: .78rem; color: var(--muted); margin-bottom: 16px; }
    .crumbs b { color: var(--soft); font-weight: 500; }
    .layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 22px; align-items: start; }

    /* sidebar */
    .side { position: sticky; top: 14px; display: flex; flex-direction: column; gap: 14px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
    .card-h { font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--soft); padding: 12px 14px; border-bottom: 1px solid var(--line); text-align: center; }
    .who { padding: 14px; text-align: center; }
    .who .crest { margin: 0 auto 8px; width: 64px; height: 64px; }
    .who small { display: block; color: var(--muted); font-size: .72rem; font-style: italic; }
    .who b { font-weight: 600; }
    .toc { list-style: none; margin: 0; padding: 8px 0; counter-reset: toc; }
    .toc li { counter-increment: toc; }
    .toc button { display: block; width: 100%; text-align: left; background: none; border: 0; border-left: 2px solid transparent; color: var(--muted); padding: 5px 14px; font-size: .8rem; cursor: pointer; }
    .toc button::before { content: counter(toc) ". "; }
    .toc button:hover { color: var(--text); }
    .toc button.on { color: #fff; border-left-color: var(--blue); background: var(--blue-soft); }

    /* title card */
    .title { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 18px 20px; margin-bottom: 18px; }
    .title h1 { margin: 0 0 4px; font-size: 1.7rem; line-height: 1.25; font-weight: 600; }
    .meta { color: var(--muted); font-size: .8rem; }
    .meta b { color: var(--soft); font-weight: 500; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .badge { font-size: .72rem; padding: 2px 8px; border-radius: 3px; background: var(--panel-2); border: 1px solid var(--line-2); color: var(--soft); }
    .badge.fam { background: var(--accent); color: #111; border-color: transparent; font-weight: 600; }
    .badge.warn { color: #f0c05a; border-color: rgba(240, 192, 90, .45); background: rgba(240, 192, 90, .08); }

    /* sections */
    .sec { margin-bottom: 30px; scroll-margin-top: 14px; }
    .sec-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .sec-h h2 { margin: 0; font-size: 1.35rem; font-weight: 600; border-left: 4px solid var(--blue); padding-left: 10px; line-height: 1.2; }
    .collapse { background: var(--panel); border: 1px solid var(--line-2); color: var(--soft); border-radius: 3px; padding: 3px 10px; font-size: .75rem; cursor: pointer; }
    .collapse:hover { color: #fff; border-color: var(--blue); }
    .sec.closed .sec-b { display: none; }
    .sec-b > p { margin: 0 0 10px; color: var(--soft); }
    .hl { color: var(--hl); }

    /* phase switcher */
    .switch { margin-top: 14px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px 10px; }
    .switch-l { font-size: .7rem; color: var(--muted); margin-bottom: 6px; }
    .phases { display: flex; flex-wrap: wrap; gap: 6px; }
    .phases a { color: var(--soft); background: var(--panel-2); border: 1px solid var(--line-2); padding: 5px 16px; border-radius: 3px; font-size: .85rem; font-weight: 500; }
    .phases a:hover { color: #fff; border-color: var(--muted); }
    .phases a.on { background: var(--blue); border-color: var(--blue); color: #fff; }

    /* equipment tabs */
    .tabs { display: flex; justify-content: center; gap: 4px; margin-bottom: 10px; }
    .tabs button { background: var(--panel); border: 1px solid var(--line-2); color: var(--soft); padding: 5px 16px; border-radius: 3px; cursor: pointer; font-size: .82rem; }
    .tabs button.on { color: #fff; border-color: var(--blue); background: var(--blue-soft); }
    .eq { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 14px; align-items: start; }
    .doll { background: radial-gradient(ellipse at 50% 45%, color-mix(in srgb, var(--accent) 16%, var(--panel)) 0%, var(--panel) 62%); border: 1px solid var(--line); border-radius: 4px; padding: 14px; }
    .doll-grid { display: grid; grid-template-columns: minmax(0, 1fr) 200px minmax(0, 1fr); gap: 8px; }
    .doll-col { display: flex; flex-direction: column; gap: 12px; position: relative; z-index: 1; }
    .doll-col.r .item { flex-direction: row-reverse; text-align: right; }
    .figure { display: flex; align-items: center; justify-content: center; }
    .figure img { width: 100%; height: auto; mix-blend-mode: lighten; opacity: .9;
      -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%); mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%); }
    .doll-cap { text-align: center; font-size: .72rem; color: var(--muted); margin-top: 10px; }

    .item { display: flex; gap: 12px; align-items: center; min-height: 64px; }
    /* Item slot styled like the D2 inventory: dark recessed cell, tinted by rarity */
    .icon { position: relative; flex: none; width: 64px; height: 64px; border-radius: 3px; display: grid; place-items: center; font-size: .66rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--c);
      background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--c) 16%, #121317) 0%, #08090b 75%);
      border: 1px solid color-mix(in srgb, var(--c) 45%, #2b2d34); box-shadow: inset 0 0 12px rgba(0, 0, 0, .85), 0 1px 0 rgba(255, 255, 255, .03); }
    .icon img { width: 56px; height: 58px; object-fit: contain; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .8)); }
    .icon img.gif { mix-blend-mode: lighten; filter: none; }
    .r-any .icon img { filter: grayscale(.7) brightness(.75); }
    .item:hover .icon { border-color: var(--c); }
    .icon input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; margin: 0; cursor: pointer; }
    .icon .tick { position: absolute; right: -5px; bottom: -5px; width: 17px; height: 17px; border-radius: 50%; background: var(--panel-2); border: 1px solid var(--line-2); display: grid; place-items: center; font-size: .65rem; color: transparent; pointer-events: none; }
    .have .icon .tick { background: var(--set); border-color: var(--set); color: #0c0d10; }
    .icon:has(input:focus-visible) { outline: 2px solid var(--blue); outline-offset: 2px; }
    .item .t { min-width: 0; }
    .item .n { font-weight: 500; font-size: .86rem; line-height: 1.25; color: var(--c); }
    .item .k { font-size: .68rem; color: var(--muted); line-height: 1.3; }
    .have .n { text-decoration: line-through; opacity: .65; }
    .r-unique { --c: var(--unique); } .r-set { --c: var(--set); } .r-runeword { --c: var(--runeword); } .r-rare { --c: var(--rare); }
    .r-magic { --c: var(--magic); } .r-crafted { --c: var(--crafted); } .r-base { --c: var(--base); } .r-any { --c: var(--any); }
    .r-any .n { font-style: italic; font-weight: 400; }
    span[class^="r-"], span[class*=" r-"] { color: var(--c); }

    .box { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; margin-bottom: 14px; }
    .box-h { text-align: center; font-weight: 600; padding: 9px; border-bottom: 1px solid var(--line); font-size: .95rem; }
    .box-b { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
    .box-b .item { min-height: 0; }
    .box-b .icon { width: 48px; height: 48px; font-size: .6rem; }
    .box-b .icon img { width: 42px; height: 44px; }
    .alt-ico { width: 18px; height: 18px; object-fit: contain; vertical-align: -4px; margin-right: 3px; }
    .alt-ico.gif { mix-blend-mode: lighten; }
    .empty { color: var(--muted); font-size: .8rem; font-style: italic; }

    .stats { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 14px 18px; }
    .stats ol { margin: 0; padding-left: 1.3em; }
    .stats li { margin: 4px 0; }

    /* tips */
    .tips { margin-top: 18px; }
    .tips h3 { color: var(--blue); font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; margin: 16px 0 6px; font-weight: 600; }
    .tips ul { margin: 0; padding-left: 1.3em; }
    .tips li { margin: 4px 0; color: var(--soft); }
    .tips li ul { margin-top: 2px; }

    /* skills */
    .sk { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
    .sk-img { width: 40px; height: 40px; border-radius: 3px; border: 1px solid #4a3f2c; box-shadow: 0 0 0 1px #000, 0 2px 6px rgba(0, 0, 0, .6); display: block; }
    .sk-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 14px; border-top: 1px solid var(--line); }
    .sk-row:first-child { border-top: 0; }
    .sk-ico { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .78rem; color: var(--accent);
      background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--accent) 30%, #1a1b20), #0c0d10); border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); }
    .sk-n { font-weight: 500; }
    .sk-note { display: block; font-size: .76rem; color: var(--muted); }
    .pts { min-width: 46px; text-align: center; font-weight: 600; font-size: .85rem; color: #fff; background: var(--blue-soft); border: 1px solid rgba(5, 122, 240, .45); border-radius: 3px; padding: 2px 8px; white-space: nowrap; }

    .merc-type { font-weight: 600; margin-bottom: 10px; }
    .merc { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 14px; }
    .note-p { color: var(--soft); font-size: .85rem; margin: 10px 0 0; }

    .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .78rem; margin-top: 10px; }
    .foot { color: var(--muted); font-size: .78rem; border-top: 1px solid var(--line); padding-top: 14px; }

    @media (max-width: 1000px) {
      .eq { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 820px) {
      .layout { grid-template-columns: minmax(0, 1fr); }
      .side { position: static; }
      .side .card:first-child { display: none; }
      .toc { display: flex; flex-wrap: wrap; gap: 2px 0; padding: 6px; }
      .toc button { border-left: 0; border-radius: 3px; padding: 4px 10px; }
    }
    @media (max-width: 600px) {
      .doll-grid { grid-template-columns: minmax(0, 1fr); }
      .figure { display: none; }
      .doll-col.r .item { flex-direction: row; text-align: left; }
      .title h1 { font-size: 1.35rem; }
      .banner { height: 84px; }
      .banner-title { font-size: 1.15rem; }
      .banner-art { display: none; }
      .builds a { padding: 10px 8px; }
    }
  </style>
</head>
<body>
  <header class="bar"><div class="bar-in"><div class="logo">PD2 <span>S14</span> Druid</div><nav class="builds" id="builds" aria-label="Builds"></nav></div></header>
  <div class="banner"><img class="banner-art" src="img/druid.jpg" alt=""><div class="banner-in"><div class="crest" id="crest">D</div><div class="banner-title">Venom → Shockwave</div></div></div>
  <div class="wrap">
    <div class="crumbs" id="crumbs"></div>
    <div class="layout">
      <aside class="side">
        <div class="card"><div class="card-h">Build</div><div class="who"><div class="crest" id="crest2">D</div><b id="who-name"></b><small>Season 14 Druid</small></div></div>
        <div class="card"><div class="card-h">Table of contents</div><ol class="toc" id="toc"></ol></div>
      </aside>
      <main id="main"></main>
    </div>
  </div>

  <script>
  /* Gear per phase comes from the build brief's three videos (V1 = Poison AFK mapper, V2 = S14 Shockwave guide,
     V3 = S12 Poison summoner) plus the S14 beta patch notes. Edit the BUILDS data below to change any phase.
     Gear row: [slot, item, rarity, note, alternatives]. Rarity: unique | set | runeword | rare | magic | crafted | base | any */
  const BUILDS = [
    { id: 'poison', name: 'Poison Creeper', fam: 'poison', phases: [
      { id: 'leveling', name: 'Leveling', tags: ['Ladder start', 'Normal → Hell'],
        goal: 'Get through Normal, Nightmare and Hell. Wear whatever drops that gives +skills, resists, life or cast rate, then cap resists for Hell.',
        gear: [
          ['Helm', '+Skills / life / res helm', 'any'], ['Amulet', '+Skills / res amulet', 'any'],
          ['Weapon', '+Poison Creeper or +Summoning weapon', 'any', 'Cast rate is a bonus'], ['Offhand', 'Shield with block / res', 'any'],
          ['Armor', 'Res / life armor', 'any'], ['Gloves', 'Res / cast rate', 'any'], ['Belt', 'Life / res', 'any'], ['Boots', 'Run speed / res', 'any'],
          ['Ring 1', 'Res / cast rate', 'any'], ['Ring 2', 'Res / cast rate', 'any'],
        ],
        charms: [['Charms', 'Life / res small charms as they drop', 'any']],
        swap: [],
        merc: { type: 'Your pick while leveling', gear: [['Weapon', 'Anything usable', 'any'], ['Helm', 'Anything usable', 'any'], ['Armor', 'Anything usable', 'any']] },
        skills: [['Poison Creeper', 'first', 'Main damage'], ['Carrion Vine', 'as you go', 'Life'], ['Solar Creeper', 'as you go', 'Mana'], ['Oak Sage', '1+', 'Life buff']],
        targets: ['Resists capped for Hell', 'S14 beta patch 1: Poison Creeper is stronger early and no longer has a cooldown'] },

      { id: 'budget', name: 'Budget', tags: ['Early Hell', 'First maps', 'Suggested'],
        goal: 'Cheap step between Leveling and Farming: runewords you can make yourself and easy uniques that trade for little. Enough to clear Hell and start low-tier maps while you save up for Farming gear. This phase is a suggestion, not from the videos, so swap anything you like.',
        gear: [
          ['Helm', "Jalal's Mane", 'unique', '+Druid skills, life, mana', [['Magic +3 Poison Creeper pelt', 'magic']]],
          ['Amulet', '+2 Druid skills amulet', 'magic', 'Res or FCR is a bonus'],
          ['Weapon', 'Spirit sword', 'runeword', 'Tal Thul Ort Amn. +2 skills, 25–35 FCR'],
          ['Offhand', 'Spirit shield', 'runeword', 'Same runes. Res and more FCR'],
          ['Armor', 'Skin of the Vipermagi', 'unique', '+1 skills, res, FCR', [['Smoke', 'runeword']]],
          ['Gloves', 'Magefist', 'unique', 'FCR', [['Frostburn', 'unique']]],
          ['Belt', 'FCR / res belt', 'rare'],
          ['Boots', 'Tri-res boots', 'magic'],
          ['Ring 1', 'FCR / res ring', 'rare'], ['Ring 2', 'FCR / res ring', 'rare'],
        ],
        charms: [['Grand', 'Cheap Summoning grand charms', 'magic', 'Any you find'], ['Small', 'Life / res small charms', 'magic']],
        swap: [['Swap', 'Call to Arms', 'runeword', 'Only if it\'s cheap this season; skip it otherwise']],
        merc: { type: 'Act 2 — defensive', gear: [['Weapon', 'Insight', 'runeword', 'Mana regen aura'], ['Armor', 'Smoke', 'runeword'], ['Helm', 'Res / life helm', 'any']],
          alt: 'Move the merc to Plague + Innocence once you reach Farming.' },
        skills: [['Poison Creeper', '20'], ['Carrion Vine', '20'], ['Solar Creeper', 'as you go'], ['Oak Sage', '1+'], ['Cyclone Armor', '1'], ['Gust', '1', 'Mobility']],
        targets: ['Resists capped for Hell (75%)', 'Cast rate: 37 early, push for 68', 'Next step: Farming gear (Spirit Keeper, Plague, Spirit Ward)'] },

      { id: 'farming', name: 'Farming', tags: ['Mapping', 'Video 1 + Video 3'],
        goal: 'Main farming setup. Both videos are mapping showcases, and V3 says this setup is weak at bosses, so don\'t take it as proof that it can boss.',
        gear: [
          ['Helm', 'Spirit Keeper', 'unique', 'Two spirits: Oak + Barbs (V1)', [["Aldur's set helm", 'set'], ['Rare +Poison Creeper pelt', 'rare']]],
          ['Amulet', '+Summoning amulet', 'magic', 'Magic or crafted', [["Mara's Kaleidoscope", 'unique']]],
          ['Weapon', 'Plague', 'runeword', 'In a +Poison Creeper base (V1)', [['Heart of the Oak', 'runeword'], ['Crafted +5/+6 Poison Creeper club', 'crafted']]],
          ['Offhand', 'Spirit Ward', 'unique', 'Ideally with a +skills corruption'],
          ['Armor', 'Steel Carapace', 'unique', '', [["Arkaine's Valor", 'unique']]],
          ['Gloves', 'Occultist', 'unique', 'Cast rate (V3)'],
          ['Belt', 'Arachnid Mesh', 'unique'],
          ['Boots', 'Marrowwalk', 'unique', '', [['Tri-res boots', 'magic']]],
          ['Ring 1', 'Stone of Jordan', 'unique'],
          ['Ring 2', "Bul-Kathos' Wedding Band", 'unique', '', [['Raven Frost', 'unique']]],
        ],
        charms: [['Grand', 'Summoning grand charms', 'magic'], ['Small', 'Life / res small charms', 'magic']],
        swap: [['Swap', 'Call to Arms', 'runeword'], ['Swap offhand', 'Lidless Wall', 'unique']],
        merc: { type: 'Act 2 — defensive (V3)', gear: [['Weapon', 'Plague', 'runeword', 'Lower Resist procs'], ['Armor', 'Innocence', 'runeword', 'Name from transcript, needs checking']], alt: 'Alt: Act 1 with Demon Machine + Innocence (V3). S14 note: Demon Machine\'s Multiple Shot procs no longer trigger other procs.' },
        skills: [['Poison Creeper', '20'], ['Carrion Vine', '20'], ['Solar Creeper', '20'], ['Rabies', '1+', 'Synergy, with Werewolf / Feral Rage prereqs'],
          ['Arctic Blast', '1'], ['Cyclone Armor', '1'], ['Gust', '1', 'Mobility'], ['Heart of Wolverine', '1'], ['Spirit of Barbs', '1'], ['Oak Sage', 'rest', 'Leftover points']],
        targets: ['Dex for 75% block with Spirit Ward (V1)', 'Str for gear, rest into Vitality', 'Cast rate: V3 aims for 68 or 99'] },

      { id: 'bossing', name: 'Bossing', tags: ['Uber Tristram', 'T0 Diablo Clone', 'Experimental'], warn: true,
        goal: 'Separate setup for farming your own Hellfire Torch and Annihilus. The Oct 21 beta patch hit Poison Creeper\'s single-target damage hard, so test it on map/Hell bosses before relying on it.',
        gear: [
          ['Helm', 'Rare +Poison Creeper pelt', 'rare', 'S14: +3 Summoning can roll on rare pelts', [['Spirit Keeper', 'unique']]],
          ['Amulet', '+Summoning / res amulet', 'magic'],
          ['Weapon', 'Crafted +Poison Creeper club', 'crafted', 'S14: +3 Summoning can roll on rare clubs'],
          ['Offhand', 'Spirit Ward', 'unique', 'Max block option'],
          ['Armor', 'Res / PDR armor', 'rare', 'S14: PDR affixes now roll on rare chests'],
          ['Gloves', 'Res / cast rate gloves', 'rare'],
          ['Belt', 'Max-res belt', 'rare', 'S14: +2–3% max res rolls on belts'],
          ['Boots', 'Tri-res boots', 'magic'],
          ['Ring 1', 'Res ring', 'rare'], ['Ring 2', 'Res ring', 'rare'],
        ],
        charms: [['Small', 'Life / res small charms', 'magic'], ['Grand', 'Summoning grand charms', 'magic'], ['Goal', 'Hellfire Torch — self-farmed', 'unique'], ['Goal', 'Annihilus — self-farmed', 'unique']],
        swap: [['Swap', 'Call to Arms', 'runeword'], ['Swap offhand', 'Lidless Wall', 'unique']],
        merc: { type: 'To be tested', gear: [], alt: 'S14: Act 3 Static Field no longer does % life damage, so older boss-merc advice may not hold.' },
        skills: [['Same as Farming', '—', 'Adjust after boss testing']],
        targets: ['T0 Clone: 90% fire res, 25% PDR (Hiim S14 reference)', 'T0 mats: Pure Demonic Essence (map bosses), Black Soulstone (Uber Trist bosses), Prime Evil Soul (Hell Meph/Diablo/Baal)', 'Uber Tristram S14 entry recipe: not confirmed yet'] },
    ] },

    { id: 'shock', name: 'Shockwave', fam: 'shock', phases: [
      { id: 'budget', name: 'Budget', tags: ['Respec', 'Video 2 ~4:34'],
        goal: 'Cheap starting Shockwave Werebear. S14 patch notes confirm Shockwave, Twister and Tornado still get Deadly Strike and Critical Strike.',
        gear: [
          ['Helm', '+3 Shapeshifting circlet', 'magic', 'S14: Deadly Strike no longer rolls on circlets'],
          ['Amulet', '+3 Shapeshifting amulet', 'magic'],
          ['Weapon', 'Memory', 'runeword', '4os staff: Lum Io Sol Eth', [['Insight staff', 'runeword']]],
          ['Offhand', 'None (staff is two-handed)', 'any'],
          ['Armor', 'Smoke', 'runeword', 'Nef Lum'],
          ['Gloves', '+2/+3 Shapeshifting, 10–20 FCR', 'magic', 'Some can be bought from Anya (V2)'],
          ['Belt', 'FCR belt', 'rare', 'Rare or crafted'],
          ['Boots', 'Tri-res boots', 'magic'],
          ['Ring 1', 'Half Freeze Duration ring', 'crafted', '+ any life / mana / res'], ['Ring 2', 'Half Freeze Duration ring', 'crafted'],
        ],
        charms: [['Small', 'Res / life / FHR small charms', 'magic']],
        swap: [['Swap', 'Teleport-charge staff', 'magic', 'Travel while unshifted']],
        merc: { type: 'Act 1', gear: [['Weapon', 'Witchwild String', 'unique', 'Amplify Damage procs'], ['Armor', 'Smoke', 'runeword'], ['Other', 'Cheap leech / survival pieces', 'any']] },
        skills: [['Shockwave', '20'], ['Werebear', '20'], ['Twister', '20', 'Synergy'], ['Spirit of Barbs', '20', 'S14: max Deadly Strike now only counts hard points'],
          ['Hunger', '1', 'Run speed'], ['Carrion Vine', '1', 'Sustain'], ['Solar Creeper', '1', 'Sustain'], ['Gust', '1', 'Optional, travel'], ['Lycanthropy', 'rest']],
        targets: ['99 FCR (V2)', '37 or 54 FHR early (V2)', 'Str/Dex for gear only, rest Vitality'] },

      { id: 'mid', name: 'Mid', tags: ["Cerebus' Bite", 'Video 2 ~12:09'],
        goal: "First Deadly Strike upgrade: Cerebus' Bite, then FCR gear so you can drop the budget pieces.",
        gear: [
          ['Helm', "Cerebus' Bite", 'unique', 'DS chance (~33% per V2). S14: +2 Hunger, +2 Feral Rage'],
          ['Amulet', '+Shapeshifting FCR amulet', 'rare', 'S14: 20% FCR can roll on rare amulets'],
          ['Weapon', 'Memory', 'runeword', 'Keep until Death Cleaver'],
          ['Offhand', 'None (staff is two-handed)', 'any'],
          ['Armor', 'Smoke', 'runeword'],
          ['Gloves', '+Shapeshifting FCR gloves', 'rare', 'S14: 10–20% DS can roll on rare gloves'],
          ['Belt', '~20 FCR belt', 'rare'],
          ['Boots', 'Tri-res boots', 'magic'],
          ['Ring 1', 'FCR / res ring', 'rare'], ['Ring 2', 'FCR / res ring', 'rare'],
        ],
        charms: [['Small', 'Res / life / FHR small charms', 'magic'], ['Grand', 'Shapeshifting skillers as you find them', 'magic']],
        swap: [['Swap', 'Call to Arms', 'runeword', 'Or keep the teleport staff'], ['Swap offhand', 'Lidless Wall', 'unique']],
        merc: { type: 'Act 1', gear: [['Weapon', 'Witchwild String', 'unique'], ['Armor', 'Smoke', 'runeword']] },
        skills: [['Same as Budget', '—']],
        targets: ['99 FCR', '54 FHR'] },

      { id: 'endgame', name: 'Endgame', tags: ['Deadly Strike package', 'Video 2 ~14:18'],
        goal: 'Deadly Strike multiplier stack: Death Cleaver +50%, Lance Guard +25%, Wraithskin +25%. That means 250% damage when Deadly Strike procs, not 2.5× average DPS.',
        gear: [
          ['Helm', 'Fenris', 'unique', 'S14: phys pierce now −5 to −8%', [["Cerebus' Bite", 'unique'], ['Denmother (FCR)', 'unique'], ['Rare/crafted +Shockwave pelt', 'rare']]],
          ['Amulet', '+Shapeshifting FCR amulet', 'rare'],
          ['Weapon', 'Death Cleaver', 'unique', '+50% DS multiplier (V2)', [['Headstriker', 'unique']]],
          ['Offhand', 'Lance Guard', 'unique', '+25% DS multiplier (V2)'],
          ['Armor', 'Wraithskin', 'unique', '+25% DS multiplier (V2)'],
          ['Gloves', '+Shapeshifting FCR gloves', 'rare'],
          ['Belt', '~20 FCR belt', 'rare'],
          ['Boots', 'Tri-res boots', 'magic'],
          ['Ring 1', 'FCR ring', 'rare'], ['Ring 2', 'Constricting Ring', 'unique'],
        ],
        charms: [['Grand', '~9 Shapeshifting skillers', 'magic', 'With FRW or FHR if possible'], ['Unique', 'Hellfire Torch', 'unique'], ['Unique', 'Annihilus', 'unique']],
        swap: [['Swap', 'Call to Arms', 'runeword'], ['Swap offhand', 'Lidless Wall', 'unique']],
        merc: { type: 'Act 1', gear: [['Weapon', 'Witchwild String', 'unique'], ['Armor', 'Smoke', 'runeword']] },
        skills: [['Same as Budget', '—']],
        targets: ['99 FCR (163 is a costly stretch, V2)', '54 or 86 FHR', 'S14 corruption: +20% FCR on chest (tier 3)'] },
    ] },
  ];

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const KEY = 'pd2-druid-got';
  let got = {};
  try { got = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { got = {}; }
  const saveGot = () => { try { localStorage.setItem(KEY, JSON.stringify(got)); } catch (e) {} };

  const ABBR = { Helm: 'Helm', Amulet: 'Amu', Weapon: 'Wpn', Offhand: 'Off', Armor: 'Arm', Gloves: 'Glv', Belt: 'Belt', Boots: 'Boot', 'Ring 1': 'Ring', 'Ring 2': 'Ring',
    Grand: 'GC', Small: 'SC', Swap: 'Swap', 'Swap offhand': 'Off', Charms: 'Chm', Unique: 'Uni', Goal: 'Goal', Other: '…' };
  const KIND = { Grand: 'Grand Charm', Small: 'Small Charm', Charms: 'Charm', Unique: 'Charm', Goal: 'Charm', Swap: 'Weapon (swap)', 'Swap offhand': 'Offhand (swap)', Other: 'Gear' };
  const RAR = { unique: 'Unique', set: 'Set', runeword: 'Runeword', rare: 'Rare', magic: 'Magic', crafted: 'Crafted', base: 'Base' };
  const LEFT = ['Helm', 'Armor', 'Gloves', 'Belt', 'Weapon'], RIGHT = ['Amulet', 'Ring 1', 'Ring 2', 'Boots', 'Offhand'];
  const SECTIONS = [['intro', 'Introduction'], ['equipment', 'Equipment'], ['skills', 'Skills'], ['merc', 'Mercenary'], ['key', 'Rarity Key']];
  let eqTab = 'gear';
  let lastBuild = null;

  /* Item art: classic Diablo II inventory sprites (PD2 wiki + classic.battle.net), saved in img/.
     Named items use their own art; runewords, rares and stat-priority rows show a fitting base item. */
  const IMG = {
    'Spirit Keeper': 'antlers.png', "Aldur's set helm": 'aldurs_stony_gaze.png', 'Rare +Poison Creeper pelt': 'wolf_head.png', 'Rare/crafted +Shockwave pelt': 'wolf_head.png',
    "Cerebus' Bite": 'cerebus_bite.png', 'Fenris': 'fenris.png', 'Denmother (FCR)': 'denmother.png', '+3 Shapeshifting circlet': 'circlet.png',
    '+Summoning amulet': 'amulet_3.png', '+Summoning / res amulet': 'amulet_3.png', "Mara's Kaleidoscope": 'amulet_1.png', '+3 Shapeshifting amulet': 'amulet_2.png', '+Shapeshifting FCR amulet': 'amulet_2.png',
    'Plague': 'club.png', 'Heart of the Oak': 'flail.png', 'Crafted +5/+6 Poison Creeper club': 'spiked_club.png', 'Crafted +Poison Creeper club': 'spiked_club.png',
    'Memory': 'battle_staff.png', 'Insight staff': 'long_staff.png', 'Death Cleaver': 'death_cleaver.gif', 'Headstriker': 'headstriker.gif',
    "Jalal's Mane": 'spirit_mask.png', 'Magic +3 Poison Creeper pelt': 'wolf_head.png', '+2 Druid skills amulet': 'amulet_2.png', 'Spirit sword': 'crystal_sword.png', 'Spirit shield': 'large_shield.png',
    'Skin of the Vipermagi': 'skin_of_the_vipermagi.png', 'Magefist': 'magefist.png', 'Frostburn': 'leather_gloves.png', 'FCR / res belt': 'light_belt.png',
    'Cheap Summoning grand charms': 'grand_charm_1.png', 'Insight': 'halberd_d2.png', 'Res / life helm': 'wolf_head.png',
    'Spirit Ward': 'spirit_ward.gif', 'Lance Guard': 'lance_guard.png', 'None (staff is two-handed)': null,
    'Steel Carapace': 'steel_carapace.png', "Arkaine's Valor": 'arkaines_valor.png', 'Res / PDR armor': 'light_plate.png', 'Smoke': 'hard_leather_armor.png', 'Wraithskin': 'wraithskin.png', 'Innocence': 'breast_plate.png',
    'Occultist': 'occultist.png', 'Res / cast rate gloves': 'heavy_gloves.png', '+2/+3 Shapeshifting, 10–20 FCR': 'leather_gloves.png', '+Shapeshifting FCR gloves': 'leather_gloves.png',
    'Arachnid Mesh': 'arachnid_mesh.png', 'Max-res belt': 'heavy_belt.png',
    'Marrowwalk': 'chain_boots.png', 'Tri-res boots': 'boots.png',
    'Stone of Jordan': 'ring_3.png', "Bul-Kathos' Wedding Band": 'ring_1.png', 'Raven Frost': 'ring_2.png', 'Res ring': 'ring_4.png', 'Half Freeze Duration ring': 'ring_4.png',
    'FCR / res ring': 'ring_5.png', 'FCR ring': 'ring_2.png', 'Constricting Ring': 'ring_5.png',
    'Summoning grand charms': 'grand_charm_1.png', 'Shapeshifting skillers as you find them': 'grand_charm_2.png', '~9 Shapeshifting skillers': 'grand_charm_2.png',
    'Hellfire Torch': 'hellfire_torch.png', 'Hellfire Torch — self-farmed': 'hellfire_torch.png', 'Annihilus': 'annihilus.png', 'Annihilus — self-farmed': 'annihilus.png',
    'Call to Arms': 'crystal_sword.png', 'Lidless Wall': 'lidless_wall.png', 'Teleport-charge staff': 'gnarled_staff.png', 'Witchwild String': 'witchwild_string.png', 'Cheap leech / survival pieces': null,
  };
  const SLOT_IMG = { Helm: 'wolf_head.png', Amulet: 'amulet_3.png', Weapon: 'club.png', Offhand: 'small_shield.png', Armor: 'hard_leather_armor.png', Gloves: 'leather_gloves.png',
    Belt: 'light_belt.png', Boots: 'boots.png', 'Ring 1': 'ring_2.png', 'Ring 2': 'ring_2.png', Grand: 'grand_charm_1.png', Small: 'small_charm_1.png', Charms: 'small_charm_1.png' };
  const SKILL_IMG = { 'Poison Creeper': 1, 'Carrion Vine': 1, 'Solar Creeper': 1, 'Rabies': 1, 'Arctic Blast': 1, 'Cyclone Armor': 1, 'Gust': 1, 'Heart of Wolverine': 1,
    'Spirit of Barbs': 1, 'Oak Sage': 1, 'Shockwave': 'shock_wave', 'Werebear': 1, 'Twister': 1, 'Hunger': 1, 'Lycanthropy': 1 };
  const pic = (slot, name) => (name in IMG ? IMG[name] : SLOT_IMG[slot] || null);
  const imgTag = (file, cls) => file ? `<img src="img/${file}" alt="" loading="lazy" class="${cls || ''}${file.endsWith('.gif') ? ' gif' : ''}">` : '';
  const skillImg = (n) => SKILL_IMG[n] ? `<img class="sk-img" src="img/${SKILL_IMG[n] === 1 ? n.toLowerCase().replace(/ /g, '_') : SKILL_IMG[n]}.png" alt="" loading="lazy">` : '';

  function item(row, k) {
    const [slot, name, rar] = row;
    const can = rar !== 'any';
    const where = KIND[slot] || slot.replace(/ \d$/, '');
    const kind = rar === 'any' ? 'Stat priority · ' + where : RAR[rar] + ' ' + where;
    const file = pic(slot, name);
    return `<div class="item r-${rar} ${can && got[k] ? 'have' : ''}">
      <div class="icon">${file ? imgTag(file) : esc(ABBR[slot] || slot.slice(0, 3))}${can ? `<input type="checkbox" data-k="${esc(k)}" ${got[k] ? 'checked' : ''} aria-label="Got ${esc(name)}" title="Tick when you've got it"><span class="tick">✓</span>` : ''}</div>
      <div class="t"><div class="n">${esc(name)}</div><div class="k">${esc(kind)}</div></div></div>`;
  }
  const list = (rows, prefix) => rows.length ? rows.map((r, i) => item(r, prefix + ':' + i + ':' + r[1])).join('') : '<div class="empty">Nothing set yet.</div>';

  function doll(ph, prefix) {
    const col = (slots) => slots.map((s) => { const i = ph.gear.findIndex((r) => r[0] === s); return i < 0 ? '' : item(ph.gear[i], prefix + ':' + i + ':' + ph.gear[i][1]); }).join('');
    return `<div class="doll"><div class="doll-grid"><div class="doll-col">${col(LEFT)}</div>
      <div class="figure" aria-hidden="true"><img src="img/druid.jpg" alt=""></div>
      <div class="doll-col r">${col(RIGHT)}</div></div>
      <div class="doll-cap">Click an item's icon to tick it off once you've got it</div></div>`;
  }

  function tips(ph) {
    const rows = ph.gear.filter((r) => r[3] || (r[4] && r[4].length));
    const extra = ph.charms.concat(ph.swap).filter((r) => r[3]);
    if (!rows.length && !extra.length) return '';
    const li = (r) => `<li><span class="r-${r[2]}">${esc(r[1])}</span>${r[3] ? ' — ' + esc(r[3]) : ''}${r[4] && r[4].length ? `<ul><li>Alternatives: ${r[4].map(([n, rr]) => `<span class="r-${rr}">${imgTag(pic(r[0], n), 'alt-ico')}${esc(n)}</span>`).join(', ')}</li></ul>` : ''}</li>`;
    return `<div class="tips">${rows.length ? `<h3>Gear notes</h3><ul>${rows.map(li).join('')}</ul>` : ''}${extra.length ? `<h3>Charms &amp; swap</h3><ul>${extra.map(li).join('')}</ul>` : ''}</div>`;
  }

  const section = (id, title, body) => `<section class="sec" id="s-${id}"><div class="sec-h"><h2>${esc(title)}</h2><button class="collapse" type="button" data-col="${id}">Collapse</button></div><div class="sec-b">${body}</div></section>`;

  function render() {
    const [bid, pid] = (location.hash.slice(1) || 'poison/farming').split('/');
    const build = BUILDS.find((b) => b.id === bid) || BUILDS[0];
    const ph = build.phases.find((p) => p.id === pid) || build.phases[0];
    const pre = build.id + '/' + ph.id;
    document.body.dataset.fam = build.fam;
    document.title = build.name + ' — ' + ph.name + ' | PD2 S14 Druid';
    const crest = `<img src="img/${build.fam === 'poison' ? 'poison_creeper' : 'shock_wave'}.png" alt="">`;
    document.getElementById('crest').innerHTML = crest;
    document.getElementById('crest2').innerHTML = crest;
    document.getElementById('who-name').textContent = build.name;
    document.getElementById('builds').innerHTML = BUILDS.map((b) => `<a href="#${b.id}/${(b.phases.find((p) => p.id === 'farming') || b.phases[0]).id}" class="${b === build ? 'on' : ''}"${b === build ? ' aria-current="page"' : ''}>${esc(b.name)}</a>`).join('');
    document.getElementById('crumbs').innerHTML = `PD2 › Season 14 › Druid › <b>${esc(build.name)}</b> › ${esc(ph.name)}`;
    document.getElementById('toc').innerHTML = SECTIONS.map(([id, t]) => `<li><button type="button" data-go="${id}">${esc(t)}</button></li>`).join('');

    const intro = `<p>${esc(ph.goal)}</p>
      <div class="switch"><div class="switch-l">Switch currently displayed phase</div><div class="phases">${build.phases.map((p) => `<a href="#${build.id}/${p.id}" class="${p === ph ? 'on' : ''}"${p === ph ? ' aria-current="true"' : ''}>${esc(p.name)}</a>`).join('')}</div></div>`;

    const equipment = `<p>The items to go for in the <span class="hl">${esc(ph.name)}</span> phase of the ${esc(build.name)} Druid, plus charms, weapon swap and stat priority.</p>
      <div class="tabs" role="tablist"><button type="button" data-tab="gear" class="${eqTab === 'gear' ? 'on' : ''}" aria-selected="${eqTab === 'gear'}">Equipment</button><button type="button" data-tab="stats" class="${eqTab === 'stats' ? 'on' : ''}" aria-selected="${eqTab === 'stats'}">Stat Priority</button></div>
      <div class="eq"><div>${eqTab === 'gear' ? doll(ph, pre + ':g') : `<div class="stats"><ol>${ph.targets.map((t) => `<li>${esc(t)}</li>`).join('')}</ol></div>`}</div>
        <div><div class="box"><div class="box-h">Charms</div><div class="box-b">${list(ph.charms, pre + ':c')}</div></div>
          <div class="box"><div class="box-h">Weapon Swap</div><div class="box-b">${ph.swap.length ? list(ph.swap, pre + ':s') : '<div class="empty">No swap this phase.</div>'}</div></div></div></div>
      ${tips(ph)}`;

    const skills = `<div class="sk">${ph.skills.map(([n, p, note]) => `<div class="sk-row">${skillImg(n) || `<div class="sk-ico" aria-hidden="true">${esc(n.split(' ').filter((w) => w !== 'of').map((w) => w[0]).join('').slice(0, 2))}</div>`}
      <div><span class="sk-n">${esc(n)}</span>${note ? `<span class="sk-note">${esc(note)}</span>` : ''}</div><span class="pts">${esc(p)}</span></div>`).join('')}</div>`;

    const merc = `<div class="merc-type">${esc(ph.merc.type)}</div>${ph.merc.gear.length ? `<div class="merc">${list(ph.merc.gear, pre + ':m')}</div>` : ''}${ph.merc.alt ? `<p class="note-p">${esc(ph.merc.alt)}</p>` : ''}`;

    const key = `<div class="legend"><span class="r-unique">Unique</span><span class="r-set">Set</span><span class="r-runeword">Runeword</span><span class="r-rare">Rare</span><span class="r-crafted">Crafted</span><span class="r-magic">Magic</span><span class="r-any"><i>Any / stat priority</i></span></div>
      <p class="note-p">V1 / V2 / V3 = the three build videos. S14 notes = Season 14 open beta patch notes. Your ticks are saved in this browser only. Item, skill and Druid art © Blizzard Entertainment (Diablo II), via the PD2 wiki and classic.battle.net.</p>`;

    document.getElementById('main').innerHTML = `
      <div class="title"><h1>${esc(build.name)} Druid Build Guide — ${esc(ph.name)}</h1>
        <div class="meta">Project Diablo 2 · <b>Season 14</b> · Druid</div>
        <div class="badges"><span class="badge fam">Druid</span>${ph.tags.map((t) => `<span class="badge ${ph.warn && t === 'Experimental' ? 'warn' : ''}">${esc(t)}</span>`).join('')}</div></div>
      ${section('intro', 'Introduction', intro)}${section('equipment', 'Equipment', equipment)}${section('skills', 'Skills', skills)}${section('merc', 'Mercenary', merc)}${section('key', 'Rarity Key', key)}`;
    spy();
  }

  let observer = null;
  function spy() {
    if (observer) observer.disconnect();
    if (!('IntersectionObserver' in window)) return;
    const seen = new Map();
    observer = new IntersectionObserver((entries) => {
      entries.forEach((e) => seen.set(e.target.id, e.isIntersecting));
      const first = SECTIONS.find(([id]) => seen.get('s-' + id));
      if (!first) return;
      document.querySelectorAll('.toc button').forEach((b) => b.classList.toggle('on', b.dataset.go === first[0]));
    }, { rootMargin: '0px 0px -60% 0px' });
    SECTIONS.forEach(([id]) => { const el = document.getElementById('s-' + id); if (el) observer.observe(el); });
  }

  document.addEventListener('click', (e) => {
    const go = e.target.closest('[data-go]');
    if (go) { const s = document.getElementById('s-' + go.dataset.go); s.classList.remove('closed'); s.querySelector('.collapse').textContent = 'Collapse'; s.scrollIntoView(); return; }
    const col = e.target.closest('[data-col]');
    if (col) { const s = col.closest('.sec'); const closed = s.classList.toggle('closed'); col.textContent = closed ? 'Expand' : 'Collapse'; col.setAttribute('aria-expanded', String(!closed)); return; }
    const tab = e.target.closest('[data-tab]');
    if (tab && tab.dataset.tab !== eqTab) { eqTab = tab.dataset.tab; const y = window.scrollY; render(); window.scrollTo(0, y); }
  });
  document.addEventListener('change', (e) => {
    const k = e.target.dataset.k; if (!k) return;
    if (e.target.checked) got[k] = 1; else delete got[k];
    saveGot(); e.target.closest('.item').classList.toggle('have', e.target.checked);
  });
  window.addEventListener('hashchange', () => {
    const b = location.hash.slice(1).split('/')[0];
    const y = window.scrollY;
    render();
    // Switching phase keeps your place on the page; switching build starts at the top.
    window.scrollTo({ top: b === lastBuild ? y : 0, behavior: 'instant' });
    lastBuild = b;
  });
  lastBuild = (location.hash.slice(1) || 'poison').split('/')[0];
  render();
  </script>
